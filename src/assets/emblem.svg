<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Paths for circular text -->
    <path id="topArc"    d="M 22,120 A 98,98 0 0,1 218,120"/>
    <path id="bottomArc" d="M 38,158 A 90,90 0 0,0 202,158"/>
    <!-- Leaf gradient -->
    <radialGradient id="leafGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
  </defs>

  <!-- White background -->
  <circle cx="120" cy="120" r="119" fill="white"/>

  <!-- Outer triple rings -->
  <circle cx="120" cy="120" r="118" fill="none" stroke="#1b5e20" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="112" fill="none" stroke="#1b5e20" stroke-width="1"/>
  <circle cx="120" cy="120" r="107" fill="none" stroke="#1b5e20" stroke-width="2"/>

  <!-- Decorative dots on outer band -->
  <circle cx="120" cy="13"  r="2" fill="#1b5e20"/>
  <circle cx="156" cy="19"  r="2" fill="#1b5e20"/>
  <circle cx="188" cy="38"  r="2" fill="#1b5e20"/>
  <circle cx="210" cy="67"  r="2" fill="#1b5e20"/>
  <circle cx="220" cy="101" r="2" fill="#1b5e20"/>
  <circle cx="216" cy="137" r="2" fill="#1b5e20"/>
  <circle cx="199" cy="169" r="2" fill="#1b5e20"/>
  <circle cx="172" cy="196" r="2" fill="#1b5e20"/>
  <circle cx="139" cy="213" r="2" fill="#1b5e20"/>
  <circle cx="101" cy="217" r="2" fill="#1b5e20"/>
  <circle cx="65"  cy="210" r="2" fill="#1b5e20"/>
  <circle cx="35"  cy="192" r="2" fill="#1b5e20"/>
  <circle cx="14"  cy="166" r="2" fill="#1b5e20"/>
  <circle cx="4"   cy="133" r="2" fill="#1b5e20"/>
  <circle cx="7"   cy="97"  r="2" fill="#1b5e20"/>
  <circle cx="23"  cy="64"  r="2" fill="#1b5e20"/>
  <circle cx="50"  cy="38"  r="2" fill="#1b5e20"/>
  <circle cx="84"  cy="19"  r="2" fill="#1b5e20"/>

  <!-- Left wreath branch (5 leaves) -->
  <ellipse cx="38"  cy="100" rx="10" ry="5" fill="#2e7d32" transform="rotate(-40  38 100)"/>
  <ellipse cx="30"  cy="115" rx="10" ry="5" fill="#388e3c" transform="rotate(-25  30 115)"/>
  <ellipse cx="27"  cy="132" rx="10" ry="5" fill="#2e7d32" transform="rotate(-10  27 132)"/>
  <ellipse cx="32"  cy="148" rx="10" ry="5" fill="#388e3c" transform="rotate(10   32 148)"/>
  <ellipse cx="44"  cy="161" rx="10" ry="5" fill="#2e7d32" transform="rotate(28   44 161)"/>
  <!-- Left branch spine -->
  <line x1="55" y1="168" x2="28" y2="94" stroke="#1b5e20" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right wreath branch (5 leaves) -->
  <ellipse cx="202" cy="100" rx="10" ry="5" fill="#2e7d32" transform="rotate(40  202 100)"/>
  <ellipse cx="210" cy="115" rx="10" ry="5" fill="#388e3c" transform="rotate(25  210 115)"/>
  <ellipse cx="213" cy="132" rx="10" ry="5" fill="#2e7d32" transform="rotate(10  213 132)"/>
  <ellipse cx="208" cy="148" rx="10" ry="5" fill="#388e3c" transform="rotate(-10 208 148)"/>
  <ellipse cx="196" cy="161" rx="10" ry="5" fill="#2e7d32" transform="rotate(-28 196 161)"/>
  <!-- Right branch spine -->
  <line x1="185" y1="168" x2="212" y2="94" stroke="#1b5e20" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Stylized tree/plant in center -->
  <!-- Trunk -->
  <rect x="116" y="142" width="8" height="20" rx="3" fill="#4e342e"/>
  <!-- Ground line -->
  <ellipse cx="120" cy="162" rx="18" ry="4" fill="#558b2f" opacity="0.5"/>
  <!-- Tree canopy - 3 layers -->
  <ellipse cx="120" cy="128" rx="30" ry="20" fill="#2e7d32"/>
  <ellipse cx="120" cy="116" rx="24" ry="17" fill="#388e3c"/>
  <ellipse cx="120" cy="107" rx="17" ry="14" fill="#43a047"/>
  <!-- Small highlight dots on canopy -->
  <circle cx="112" cy="118" r="3" fill="#66bb6a" opacity="0.6"/>
  <circle cx="128" cy="115" r="2.5" fill="#66bb6a" opacity="0.6"/>
  <circle cx="120" cy="108" r="2" fill="#a5d6a7" opacity="0.7"/>

  <!-- "Wander Pires" at bottom inside -->
  <text x="120" y="185" text-anchor="middle"
        font-family="'Georgia', 'Times New Roman', serif"
        font-size="12" font-weight="700" fill="#1b5e20" letter-spacing="1">
    Wander Pires
  </text>

  <!-- Stars / separators flanking the name -->
  <text x="60"  y="186" text-anchor="middle" font-size="8" fill="#1b5e20">★</text>
  <text x="180" y="186" text-anchor="middle" font-size="8" fill="#1b5e20">★</text>

  <!-- Upper arc text: TERAPEUTA -->
  <text font-family="'Georgia', 'Times New Roman', serif"
        font-size="16" font-weight="700" fill="#1b5e20" letter-spacing="6">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">TERAPEUTA</textPath>
  </text>

  <!-- Lower arc text: FUNCIONAL -->
  <text font-family="'Georgia', 'Times New Roman', serif"
        font-size="16" font-weight="700" fill="#1b5e20" letter-spacing="6">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">FUNCIONAL</textPath>
  </text>
</svg>
